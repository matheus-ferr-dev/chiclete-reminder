services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chiclete
      POSTGRES_USER: chiclete
      POSTGRES_PASSWORD: chiclete
    ports:
      - "5432:5432"
    volumes:
      - chiclete_pg_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  chiclete_pg_data:
