spring.application.name=chiclete-test

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:mem:chiclete;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

app.jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
app.jwt.expiration-ms=86400000
app.chewing.ignore-threshold=3
app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
